<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Yangju Baby 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff5f8a, #ff8fa3);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #ff4d6d;
      font-size: 24px;
    }

    p {
      font-size: 16px;
      color: #444;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ddd;
      position: absolute;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="title"></h1>
    <p>Will you be my Valentine? 💖</p>

    <button id="yes">YES 💘</button>
    <button id="no">NO 🙈</button>

    <div class="footer">— made with ❤️</div>
  </div>

          /
      }

      function moveNo() {
          const no = document.getElementById("no");
          const x = Math.random() * (window.innerWidth - 100);
          const y = Math.random() * (window.innerHeight - 100);

          no.style.top = y + "px";

      document.getElementById("yes").onclick = yesClick;

  };
  </script>

</body>
    </html>
